<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neduvaai</title>
  <link rel="icon" type="image/png" href="/icon.png" />
  <meta name="description" content="Neduvaai — a hybrid LoRaWAN mesh that doesn't forget fishermen at sea." />
  <meta property="og:title" content="Neduvaai" />
  <meta property="og:description" content="A mesh that doesn't forget anyone." />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
      background-color: #020205;
      color: #fafafa;
      overflow-x: hidden;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    body::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    body {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    .scroll-content {
      position: relative;
      z-index: 10;
      pointer-events: none;
      /* Let clicks pass through to canvas if needed, though mostly for scroll */
    }

    .story-section {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      /* Handled by GSAP */
      transform: translateY(20px);
      /* transition: opacity 0.5s ease; REMOVED to prevent GSAP conflict */
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
